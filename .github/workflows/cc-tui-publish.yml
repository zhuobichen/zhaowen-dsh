name: Publish · dsh-cc-tui

# 发版：打带包名前缀的标签
#   git tag dsh-cc-tui-v0.4.3 && git push origin dsh-cc-tui-v0.4.3
# 需要仓库 Secrets 里的 NPM_TOKEN（对 dsh-cc-tui 有 write 权限的 granular token）。
# 标签里的版本必须与 packages/dsh-cc-tui/package.json 的 version 一致。
on:
  push:
    tags: ['dsh-cc-tui-v*']

defaults:
  run:
    working-directory: packages/dsh-cc-tui

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/dsh-cc-tui/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#dsh-cc-tui-v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: node --import tsx/esm scripts/repro-askpanel.tsx
      - run: node --import tsx/esm scripts/repro-toolcards.tsx

      - run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
