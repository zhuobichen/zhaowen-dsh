name: CI · dsh-term

on:
  push:
    branches: [main]
    paths: ['packages/dsh-term/**', '.github/workflows/term-ci.yml']
  pull_request:
    paths: ['packages/dsh-term/**', '.github/workflows/term-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/dsh-term

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
